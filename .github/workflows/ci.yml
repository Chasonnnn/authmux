name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            mise_sha256: f93483d0e7e0ad6296a5fb2600188d1dadd2c48a4d295af31b69f636a51b92e4
          - os: macos-15
            mise_sha256: 2804fae60faa9900f8397bce231498f09a0ace1b227cf06e851431dbbeff16a8

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.7.16
          sha256: ${{ matrix.mise_sha256 }}
          cache: true

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint all targets
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test all features
        run: cargo test --all-features

      - name: Build locked dependencies
        run: cargo build --locked
